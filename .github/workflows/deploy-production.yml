# PRODUCTION environment – classic gitflow:
#
#   git flow release finish 1.3.0       → merges release/v1.3.0 into main (and develop) and creates tag v1.3.0
#   git push origin main develop --tags → THIS workflow: build images 1.3.0 and deploy them to "production"
#
# Without git-flow tools:
#   git checkout main && git merge --no-ff release/v1.3.0
#   git tag -a v1.3.0 -m "Release 1.3.0"
#   git push origin main --tags
#   (then merge main back into develop and delete the release branch)
#
# Why the TAG and not "push to main"? The tag names the version exactly, and a push to main
# without a release (e.g. a hotfix still in progress) does not reach production by accident.
# The job checks that the tagged commit really is on main.

name: deploy-production

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Check out the code (full history, to see main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version from the tag, tag must be on main
        id: v
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vX.Y.Z (example: v1.3.0)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main - finish the release first (merge into main)."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "Production release: ${BASH_REMATCH[1]}"

  deploy:
    needs: version
    uses: ./.github/workflows/_build-and-deploy.yml
    with:
      environment: production
      version: ${{ needs.version.outputs.version }}
      channel: latest
      lab_dir: Swagger-integration/student-docker-lab-plus-mssql   # folder of the lab in THIS repository
    secrets: inherit
    permissions:
      contents: read
      packages: write
