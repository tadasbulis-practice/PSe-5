name: simple_student_mobile
description: "Flutter mobile client (Android + iOS) for SimpleStudentApi – Heterogeneous Systems lab."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # REST calls to SimpleStudentApi
  http: ^1.2.0
  # Remembers the API address on the phone (Settings dialog on the Home tab)
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
