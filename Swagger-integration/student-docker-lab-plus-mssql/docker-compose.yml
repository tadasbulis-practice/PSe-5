networks:
  student-net:
    external: true  # created and owned by docker-compose.infra.yml

services:
  simplestudentapi:
    build:
      context: ./SimpleStudentApi
    container_name: simplestudentapi
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=mssqlserver,1433;Database=StudentDb;User Id=sa;Password=1Secure*Password1;TrustServerCertificate=True"
    ports:
      - "6001:8080"
    networks:
      - student-net

  simplestudentfrontend:
    build:
      context: ./SimpleStudentFrontend
    container_name: simplestudentfrontend
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ApiSettings__BaseUrl: http://simplestudentapi:8080   # container → container (server side)
      ApiSettings__PublicUrl: http://localhost:6001        # browser → API (Swagger link)
      ApiSettings__PhpFrontendUrl: http://localhost:6021   # browser → PHP frontend (nav link)
    ports:
      - "6011:8080"
    networks:
      - student-net
    depends_on:
      - simplestudentapi

  # Second client in another technology. It reads swagger.json and calls the API by operationId.
  simplestudentphpfrontend:
    build:
      context: ./SimpleStudentPhpFrontend
    container_name: simplestudentphpfrontend
    environment:
      API_BASE_URL: http://simplestudentapi:8080           # container → container (server side)
                                                           # PHP API instead: http://simplestudentphpapi
      API_PUBLIC_URL: http://localhost:6001                # browser → API (Swagger link)
      DOTNET_FRONTEND_URL: http://localhost:6011           # browser → .NET frontend (nav link)
    ports:
      - "6021:80"
    networks:
      - student-net
    depends_on:
      - simplestudentapi

  # The same API contract implemented in PHP. Database chosen with DB_DRIVER (sqlsrv | mysql).
  simplestudentphpapi:
    build:
      context: ./SimpleStudentPhpApi
    container_name: simplestudentphpapi
    environment:
      DB_DRIVER: sqlsrv                 # SQL Server container (same database as the .NET API)
      DB_HOST: mssqlserver
      DB_PORT: "1433"
      DB_NAME: StudentDb
      DB_USER: sa
      DB_PASSWORD: "1Secure*Password1"
      APP_ENVIRONMENT: Docker
      # --- or use the MySQL of XAMPP on your computer instead (run database/mysql/create-user.sql first):
      # DB_DRIVER: mysql
      # DB_HOST: host.docker.internal
      # DB_PORT: "3306"
      # DB_USER: student_api
      # DB_PASSWORD: "StudentApi*2026"
    ports:
      - "6002:80"
    networks:
      - student-net
    depends_on:
      - simplestudentapi                # the .NET API creates StudentDb + Students on start-up

  # The same API contract implemented in Python (FastAPI). Database chosen with DB_DRIVER (sqlsrv | mysql | sqlite).
  simplestudentpythonapi:
    build:
      context: ./SimpleStudentPythonApi
    container_name: simplestudentpythonapi
    environment:
      DB_DRIVER: sqlsrv                 # SQL Server container (same database as the .NET and PHP APIs)
      DB_HOST: mssqlserver
      DB_PORT: "1433"
      DB_NAME: StudentDb
      DB_USER: sa
      DB_PASSWORD: "1Secure*Password1"
      APP_ENVIRONMENT: Docker
      # --- or use the MySQL of XAMPP on your computer instead (run database/mysql/create-user.sql first):
      # DB_DRIVER: mysql
      # DB_HOST: host.docker.internal
      # DB_PORT: "3306"
      # DB_USER: student_api
      # DB_PASSWORD: "StudentApi*2026"
    ports:
      - "6003:8080"
    networks:
      - student-net
    depends_on:
      - simplestudentapi                # the .NET API creates StudentDb + Students on start-up
