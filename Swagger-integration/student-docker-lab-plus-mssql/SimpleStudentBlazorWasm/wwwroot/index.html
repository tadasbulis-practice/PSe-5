<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Student – Blazor WebAssembly</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
</head>
<body>
    <!-- Blazor replaces this <div> with the App component once the .NET runtime has loaded. -->
    <div id="app">
        <div class="card"><p class="loading">Loading the .NET runtime into your browser (WebAssembly)…</p></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred. <a href="" class="reload">Reload</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
