# nginx serves the published Blazor WebAssembly files. There is no .NET on this server:
# the browser downloads the app and runs it. Unknown paths (/students/5) return index.html,
# and the Blazor router decides which page to show.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
